# Outvexa — dedicated Redis (shared-server mode). Separate from any Redis other sites use.
# Queues need data kept on disk and must never be evicted.
port 6380
bind 127.0.0.1 ::1
protected-mode yes
requirepass CHANGE_ME_long_random_password
daemonize no
supervised no
dir /var/lib/emn-redis
appendonly yes
appendfsync everysec
save 900 1
save 300 10
maxmemory-policy noeviction
maxmemory 512mb
logfile ""
