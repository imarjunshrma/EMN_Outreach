# EMN Outreach OS — Nginx site (Ubuntu: /etc/nginx/sites-available/emn.conf)
# Replace outreach.example.com. Obtain TLS with: sudo certbot --nginx -d outreach.example.com
# The API and the web app listen on 127.0.0.1 only; Nginx is the only public entry point.

limit_req_zone $binary_remote_addr zone=emn_auth:10m   rate=10r/m;
limit_req_zone $binary_remote_addr zone=emn_public:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=emn_api:10m    rate=20r/s;

upstream emn_api { server 127.0.0.1:4000; keepalive 16; }
upstream emn_web { server 127.0.0.1:3000; keepalive 16; }

server {
    listen 80;
    listen [::]:80;
    server_name outreach.example.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    # Ubuntu 22.04/24.04 ship nginx 1.18/1.24, so use the listen-flag form of HTTP/2.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name outreach.example.com;

    ssl_certificate     /etc/letsencrypt/live/outreach.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/outreach.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    server_tokens off;
    client_max_body_size 21m;            # CSV import limit is 20 MB
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    access_log /var/log/nginx/emn.access.log;
    error_log  /var/log/nginx/emn.error.log warn;

    # Server-Sent Events (realtime) — no buffering, long timeout
    location ~ ^/api/v1/w/[^/]+/events$ {
        proxy_pass http://emn_api;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        add_header X-Accel-Buffering no;
    }

    # Authentication endpoints — strict per-IP limit (the API also rate-limits in Redis)
    location ~ ^/api/v1/auth/(login|register|password|mfa/verify) {
        limit_req zone=emn_auth burst=10 nodelay;
        proxy_pass http://emn_api;
    }

    # Public endpoints: unsubscribe, tracking, OAuth callback, booking/workflow hooks, Graph + billing webhooks
    location ~ ^/api/v1/(public|oauth|hooks|webhooks)/ {
        limit_req zone=emn_public burst=30 nodelay;
        proxy_pass http://emn_api;
    }

    location /api/ {
        limit_req zone=emn_api burst=60 nodelay;
        proxy_pass http://emn_api;
        proxy_read_timeout 120s;          # AI generation can take a while
    }

    location = /healthz { proxy_pass http://emn_api; access_log off; }
    location = /readyz  { allow 127.0.0.1; deny all; proxy_pass http://emn_api; }

    location / {
        proxy_pass http://emn_web;
    }
}
