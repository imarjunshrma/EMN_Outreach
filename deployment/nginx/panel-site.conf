# Outvexa — Nginx locations for a site created in a hosting panel (CloudPanel, Plesk, aaPanel…).
# Create the site as a reverse proxy to http://127.0.0.1:3000 and issue its SSL certificate in the panel.
# Then open the site's Nginx / vhost editor and, INSIDE the "server { … listen 443 … }" block,
#   1. put the lines below ABOVE the existing "location / {" block, and
#   2. leave the panel's own "location / { proxy_pass http://127.0.0.1:3000; … }" as it is.
# Rate limits are applied inside the app, so none are needed here.

client_max_body_size 21m;   # CSV import limit is 20 MB

# Live updates (server-sent events): never buffered.
location ~ ^/api/v1/w/[^/]+/events$ {
    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    add_header X-Accel-Buffering no;
}

# API: straight to the API server.
location /api/ {
    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;   # AI generation can take a while
}

location = /healthz { proxy_pass http://127.0.0.1:4000; access_log off; }
location = /readyz  { allow 127.0.0.1; deny all; proxy_pass http://127.0.0.1:4000; }
